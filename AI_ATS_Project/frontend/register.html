<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register — AI ATS Analyzer</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-gradient-to-br from-slate-900 via-blue-950 to-slate-900 flex items-center justify-center px-4 py-10">

  <div class="w-full max-w-md">
    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-blue-600 mb-4">
        <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z" />
        </svg>
      </div>
      <h1 class="text-3xl font-bold text-white">Create Account</h1>
      <p class="text-blue-300 mt-1">Join AI ATS Analyzer</p>
    </div>

    <div class="bg-white/10 backdrop-blur-md border border-white/20 rounded-2xl p-8 shadow-2xl">
      {% if messages %}
        {% for message in messages %}
          <div class="mb-4 p-3 rounded-lg bg-red-500/20 border border-red-400 text-red-300 text-sm">{{ message }}</div>
        {% endfor %}
      {% endif %}

      <form method="POST" action="/register/" class="space-y-5">
        {% csrf_token %}
        <div>
          <label class="block text-sm font-medium text-blue-200 mb-1">Username</label>
          <input type="text" name="username" required
            class="w-full px-4 py-3 rounded-xl bg-white/10 border border-white/20 text-white placeholder-blue-300 focus:outline-none focus:ring-2 focus:ring-blue-500"
            placeholder="Choose a username" />
        </div>
        <div>
          <label class="block text-sm font-medium text-blue-200 mb-1">Email</label>
          <input type="email" name="email" required
            class="w-full px-4 py-3 rounded-xl bg-white/10 border border-white/20 text-white placeholder-blue-300 focus:outline-none focus:ring-2 focus:ring-blue-500"
            placeholder="your@email.com" />
        </div>
        <div>
          <label class="block text-sm font-medium text-blue-200 mb-1">Role</label>
          <select name="role"
            class="w-full px-4 py-3 rounded-xl bg-slate-800 border border-white/20 text-white focus:outline-none focus:ring-2 focus:ring-blue-500">
            <option value="user">User</option>
            <option value="guest">Guest</option>
          </select>
        </div>
        <div>
          <label class="block text-sm font-medium text-blue-200 mb-1">Password</label>
          <input type="password" name="password" required
            class="w-full px-4 py-3 rounded-xl bg-white/10 border border-white/20 text-white placeholder-blue-300 focus:outline-none focus:ring-2 focus:ring-blue-500"
            placeholder="Create a strong password" />
        </div>
        <div>
          <label class="block text-sm font-medium text-blue-200 mb-1">Confirm Password</label>
          <input type="password" name="confirm_password" required
            class="w-full px-4 py-3 rounded-xl bg-white/10 border border-white/20 text-white placeholder-blue-300 focus:outline-none focus:ring-2 focus:ring-blue-500"
            placeholder="Repeat your password" />
        </div>
        <button type="submit"
          class="w-full py-3 px-4 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-xl transition-all duration-200">
          Create Account
        </button>
      </form>

      <p class="text-center text-blue-300 text-sm mt-6">
        Already have an account?
        <a href="/login/" class="text-blue-400 hover:text-white font-medium underline">Sign in</a>
      </p>
    </div>
  </div>
</body>
</html>
