<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — AI ATS Analyzer</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-gradient-to-br from-slate-900 via-blue-950 to-slate-900 flex items-center justify-center px-4">

  <div class="w-full max-w-md">
    <!-- Logo -->
    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-blue-600 mb-4">
        <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414A1 1 0 0119 9.414V19a2 2 0 01-2 2z" />
        </svg>
      </div>
      <h1 class="text-3xl font-bold text-white">AI ATS Analyzer</h1>
      <p class="text-blue-300 mt-1">Resume Screening &amp; Career Intelligence</p>
    </div>

    <!-- Card -->
    <div class="bg-white/10 backdrop-blur-md border border-white/20 rounded-2xl p-8 shadow-2xl">
      <h2 class="text-xl font-semibold text-white mb-6">Sign in to your account</h2>

      {% if messages %}
        {% for message in messages %}
          <div class="mb-4 p-3 rounded-lg bg-red-500/20 border border-red-400 text-red-300 text-sm">{{ message }}</div>
        {% endfor %}
      {% endif %}

      <form method="POST" action="/login/" class="space-y-5">
        {% csrf_token %}
        <div>
          <label class="block text-sm font-medium text-blue-200 mb-1">Username</label>
          <input type="text" name="username" required
            class="w-full px-4 py-3 rounded-xl bg-white/10 border border-white/20 text-white placeholder-blue-300 focus:outline-none focus:ring-2 focus:ring-blue-500"
            placeholder="Enter your username" />
        </div>
        <div>
          <label class="block text-sm font-medium text-blue-200 mb-1">Password</label>
          <input type="password" name="password" required
            class="w-full px-4 py-3 rounded-xl bg-white/10 border border-white/20 text-white placeholder-blue-300 focus:outline-none focus:ring-2 focus:ring-blue-500"
            placeholder="Enter your password" />
        </div>
        <button type="submit"
          class="w-full py-3 px-4 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-xl transition-all duration-200 shadow-lg hover:shadow-blue-500/25">
          Sign In
        </button>
      </form>

      <p class="text-center text-blue-300 text-sm mt-6">
        Don't have an account?
        <a href="/register/" class="text-blue-400 hover:text-white font-medium underline">Register here</a>
      </p>
    </div>
  </div>
</body>
</html>
