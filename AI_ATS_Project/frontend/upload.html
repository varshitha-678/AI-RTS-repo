<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Upload Resume — AI ATS Analyzer</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-950 text-white">

  <nav class="bg-slate-900 border-b border-slate-700 px-6 py-4 flex items-center justify-between">
    <a href="/dashboard/" class="flex items-center gap-3 hover:opacity-80 transition">
      <div class="w-9 h-9 rounded-xl bg-blue-600 flex items-center justify-center">
        <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
        </svg>
      </div>
      <span class="text-lg font-bold">AI ATS Analyzer</span>
    </a>
    <a href="/logout/" class="text-slate-400 hover:text-white text-sm">Logout</a>
  </nav>

  <main class="max-w-3xl mx-auto px-6 py-10">
    <h2 class="text-3xl font-bold mb-2">Analyze Your Resume</h2>
    <p class="text-slate-400 mb-8">Upload your resume and paste the job description to get your ATS score.</p>

    <!-- Step 1: Upload -->
    <div id="step1" class="bg-slate-800 rounded-2xl border border-slate-700 p-8 mb-6">
      <h3 class="text-lg font-semibold mb-4 flex items-center gap-2">
        <span class="w-7 h-7 bg-blue-600 rounded-full flex items-center justify-center text-sm font-bold">1</span>
        Upload Resume
      </h3>

      <!-- Drop zone -->
      <label id="dropZone"
        class="flex flex-col items-center justify-center w-full h-40 border-2 border-dashed border-slate-600 rounded-xl cursor-pointer hover:border-blue-500 hover:bg-blue-500/5 transition-all">
        <svg class="w-10 h-10 text-slate-500 mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
            d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12" />
        </svg>
        <p class="text-slate-400 text-sm">Drag &amp; drop or <span class="text-blue-400">browse</span></p>
        <p class="text-slate-600 text-xs mt-1">PDF, DOCX, TXT — Max 10MB</p>
        <input type="file" id="resumeFile" accept=".pdf,.docx,.doc,.txt" class="hidden" />
      </label>

      <div id="fileInfo" class="hidden mt-4 p-4 bg-green-500/10 border border-green-500/30 rounded-xl">
        <p class="text-green-400 text-sm font-medium">✓ File selected: <span id="fileName"></span></p>
      </div>

      <button id="uploadBtn"
        class="mt-5 px-6 py-3 bg-blue-600 hover:bg-blue-700 rounded-xl font-semibold transition disabled:opacity-50"
        onclick="uploadResume()">
        Upload &amp; Parse Resume
      </button>
    </div>

    <!-- Step 2: Job Description -->
    <div id="step2" class="bg-slate-800 rounded-2xl border border-slate-700 p-8 mb-6 opacity-50 pointer-events-none">
      <h3 class="text-lg font-semibold mb-4 flex items-center gap-2">
        <span class="w-7 h-7 bg-blue-600 rounded-full flex items-center justify-center text-sm font-bold">2</span>
        Job Details
      </h3>
      <div class="mb-4">
        <label class="block text-sm text-slate-400 mb-1">Job Title</label>
        <input type="text" id="jobTitle" placeholder="e.g. Full Stack Developer"
          class="w-full px-4 py-3 rounded-xl bg-slate-900 border border-slate-600 text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-blue-500" />
      </div>
      <div>
        <label class="block text-sm text-slate-400 mb-1">Job Description</label>
        <textarea id="jobDescription" rows="8" placeholder="Paste the full job description here..."
          class="w-full px-4 py-3 rounded-xl bg-slate-900 border border-slate-600 text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-blue-500 resize-none"></textarea>
      </div>
      <button class="mt-5 px-6 py-3 bg-green-600 hover:bg-green-700 rounded-xl font-semibold transition"
        onclick="analyzeResume()">
        🚀 Analyze Now
      </button>
    </div>

    <!-- Loading -->
    <div id="loadingState" class="hidden text-center py-10">
      <div class="inline-block w-12 h-12 border-4 border-blue-600 border-t-transparent rounded-full animate-spin mb-4"></div>
      <p class="text-slate-300 text-lg font-medium">Analyzing your resume...</p>
      <p class="text-slate-500 text-sm mt-1">Running NLP, BERT embeddings &amp; ensemble models</p>
    </div>

    <!-- Error -->
    <div id="errorMsg" class="hidden p-4 bg-red-500/20 border border-red-500/40 rounded-xl text-red-400 text-sm"></div>
  </main>

  <script>
    let resumeId = null;

    // File picker
    document.getElementById('dropZone').addEventListener('click', () => {
      document.getElementById('resumeFile').click();
    });
    document.getElementById('resumeFile').addEventListener('change', function () {
      if (this.files[0]) {
        document.getElementById('fileName').textContent = this.files[0].name;
        document.getElementById('fileInfo').classList.remove('hidden');
      }
    });

    // Drag and drop
    const dz = document.getElementById('dropZone');
    dz.addEventListener('dragover', e => { e.preventDefault(); dz.classList.add('border-blue-400'); });
    dz.addEventListener('dragleave', () => dz.classList.remove('border-blue-400'));
    dz.addEventListener('drop', e => {
      e.preventDefault();
      dz.classList.remove('border-blue-400');
      const file = e.dataTransfer.files[0];
      if (file) {
        document.getElementById('resumeFile').files = e.dataTransfer.files;
        document.getElementById('fileName').textContent = file.name;
        document.getElementById('fileInfo').classList.remove('hidden');
      }
    });

    function getCookie(name) {
      let value = `; ${document.cookie}`;
      let parts = value.split(`; ${name}=`);
      if (parts.length === 2) return parts.pop().split(';').shift();
    }

    async function uploadResume() {
      const file = document.getElementById('resumeFile').files[0];
      if (!file) { showError('Please select a file.'); return; }

      document.getElementById('uploadBtn').disabled = true;
      document.getElementById('loadingState').classList.remove('hidden');
      hideError();

      const formData = new FormData();
      formData.append('resume', file);

      try {
        const res = await fetch('/upload_resume', {
          method: 'POST',
          headers: { 'X-CSRFToken': getCookie('csrftoken') },
          body: formData
        });
        const data = await res.json();
        if (data.success) {
          resumeId = data.resume_id;
          document.getElementById('loadingState').classList.add('hidden');
          document.getElementById('step2').classList.remove('opacity-50', 'pointer-events-none');
          document.getElementById('uploadBtn').textContent = '✓ Resume Parsed';
          document.getElementById('uploadBtn').classList.replace('bg-blue-600', 'bg-green-600');
        } else {
          showError(data.error || 'Upload failed.');
          document.getElementById('uploadBtn').disabled = false;
          document.getElementById('loadingState').classList.add('hidden');
        }
      } catch (e) {
        showError('Network error. Please try again.');
        document.getElementById('uploadBtn').disabled = false;
        document.getElementById('loadingState').classList.add('hidden');
      }
    }

    async function analyzeResume() {
      const jd = document.getElementById('jobDescription').value.trim();
      const title = document.getElementById('jobTitle').value.trim() || 'Target Role';
      if (!jd) { showError('Please enter a job description.'); return; }
      if (!resumeId) { showError('Please upload your resume first.'); return; }

      document.getElementById('loadingState').classList.remove('hidden');
      hideError();

      try {
        const res = await fetch('/analyze_resume', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'X-CSRFToken': getCookie('csrftoken')
          },
          body: JSON.stringify({ resume_id: resumeId, job_description: jd, job_title: title })
        });
        const data = await res.json();
        if (data.success) {
          window.location.href = `/result/${data.result_id}/`;
        } else {
          showError(data.error || 'Analysis failed.');
          document.getElementById('loadingState').classList.add('hidden');
        }
      } catch (e) {
        showError('Network error. Please try again.');
        document.getElementById('loadingState').classList.add('hidden');
      }
    }

    function showError(msg) {
      const el = document.getElementById('errorMsg');
      el.textContent = msg;
      el.classList.remove('hidden');
    }
    function hideError() {
      document.getElementById('errorMsg').classList.add('hidden');
    }
  </script>
</body>
</html>
